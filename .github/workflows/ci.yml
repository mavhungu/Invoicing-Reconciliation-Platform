name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate affected projects
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: invoice_reconciliation
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d invoice_reconciliation"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CI: true
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/invoice_reconciliation?schema=public
      AUTH_ACCESS_TOKEN_SECRET: ci-only-signing-secret-not-for-deployment-use
      AUTH_ACCESS_TOKEN_TTL_SECONDS: 600
      AUTH_REFRESH_TOKEN_TTL_DAYS: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Nx affected SHAs
        uses: nrwl/nx-set-shas@v4

      - name: Use the npm version declared by the workspace
        run: npm install --global npm@12.2.1

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Lint, test, and build affected projects
        run: npx nx affected -t lint test build --parallel=3

      - name: Run affected API end-to-end tests
        run: npx nx affected -t e2e --parallel=1
